<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pentest Toolbox</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <span class="brand">PENTEST TOOLBOX</span>
          <span class="tagline">Cybersecurity operations UI</span>
        </div>
        <div class="status-pill">Online</div>
      </header>

      <main class="main-grid">
        <section class="panel panel-lg">
          <h1>Attack Surface Dashboard</h1>
          <p>Run common security tools directly from the browser. Enter a target and inspect results in a dark, hacker-inspired interface.</p>
        </section>

        <section class="panel">
          <h2>Tool Launcher</h2>

          <div class="input-group">
            <label for="tool-select">Tool</label>
            <select id="tool-select">
              <option value="nmap">Nmap</option>
              <option value="nikto">Nikto</option>
              <option value="gobuster">Gobuster</option>
              <option value="hydra">Hydra</option>
              <option value="john">John</option>
              <option value="sqlmap">SQLmap</option>
            </select>
          </div>

          <div id="tool-fields">
            <div class="input-group" id="target-group">
              <label for="target-input">Target / Host</label>
              <input id="target-input" type="text" placeholder="example.com or 10.0.0.1" />
            </div>

            <div class="input-group hidden" id="nmap-options-group">
              <label for="nmap-options-input">Nmap options</label>
              <input id="nmap-options-input" type="text" placeholder="-p 1-1000 --reason" />
            </div>

            <div class="input-group hidden" id="john-hash-group">
              <label for="hash-input">Hash file (john)</label>
              <input id="hash-input" type="text" placeholder="/path/to/hashes.txt" />
            </div>

            <div class="input-group hidden" id="john-wordlist-group">
              <label for="wordlist-input">Password list (john)</label>
              <input id="wordlist-input" type="text" placeholder="/usr/share/john/password.lst" />
            </div>

            <div class="input-group hidden" id="gobuster-wordlist-group">
              <label for="gobuster-wordlist-input">Wordlist (gobuster)</label>
              <input id="gobuster-wordlist-input" type="text" placeholder="/usr/share/wordlists/dirb/common.txt" />
            </div>

            <div class="input-group hidden" id="hydra-user-group">
              <label for="hydra-user-input">Hydra username</label>
              <input id="hydra-user-input" type="text" placeholder="root" />
            </div>

            <div class="input-group hidden" id="hydra-passlist-group">
              <label for="hydra-passlist-input">Password list (hydra)</label>
              <input id="hydra-passlist-input" type="text" placeholder="/usr/share/wordlists/rockyou.txt" />
            </div>

            <div class="input-group hidden" id="sqlmap-options-group">
              <label for="sqlmap-options-input">SQLmap options</label>
              <input id="sqlmap-options-input" type="text" placeholder="--dbs --tables" />
            </div>
          </div>

          <div class="button-grid">
            <button id="run-btn" class="tool-btn">Run</button>
          </div>
        </section>

        <section class="panel panel-full">
          <div class="panel-header">
            <h2>Execution Output</h2>
            <button id="clear-btn" class="ghost-btn">Clear</button>
          </div>
          <pre id="output-area" class="output-area">Ready. Select a tool and enter a target.</pre>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
