[tool.poetry]
name = "pentest-toolbox"
version = "0.1.0"
description = "Toolbox de pentest modulaire (Nmap, Hydra, OpenVAS, Metasploit, Nessus, Burp)"
authors = ["Florian <florian@example.com>"]
readme = "README.md"
packages = [{ include = "toolbox" }]

[tool.poetry.dependencies]
python = "^3.11"

# ========================
# API
# ========================
fastapi = "^0.115.0"
uvicorn = "^0.30.0"

# ========================
# ASYNC / TASKS
# ========================
celery = "^5.4.0"
redis = "^5.0.0"

# ========================
# DATABASE
# ========================
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.0"

# ========================
# STORAGE
# ========================
minio = "^7.2.0"

# ========================
# CONFIG / UTILS
# ========================
python-dotenv = "^1.0.1"
pydantic = "^2.7.0"
requests = "^2.32.0"

# ========================
# SECURITY
# ========================
cryptography = "^42.0.0"

# ========================
# REPORTING
# ========================
jinja2 = "^3.1.4"
matplotlib = "^3.9.0"
pandas = "^2.2.0"

# ========================
# OPENVAS (Greenbone)
# ========================
python-gvm = "^23.0.0"

# ========================
# (OPTIONNEL) Metasploit RPC
# ========================
pymetasploit3 = "^1.0.4"

[tool.poetry.group.dev.dependencies]

pytest = "^8.2.0"
pytest-cov = "^5.0.0"
black = "^24.4.0"
flake8 = "^7.0.0"
isort = "^5.13.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"